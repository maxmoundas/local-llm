[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "local-llm-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "WARNING"
markers = [
    "integration: hits real external APIs (requires API keys in .env)",
    "contract: model contract suite — run with --model <id> (tests/contract)",
]
filterwarnings = [
    "ignore:builtin type.*has no __module__:DeprecationWarning",
]
tmp_path_retention_policy = "none"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
