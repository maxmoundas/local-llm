[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Opt-in suites (real API calls / model checks) run only when selected explicitly with -m.
addopts = "-m 'not integration and not contract'"
log_cli = true
log_cli_level = "WARNING"
markers = [
    "integration: hits real external APIs (requires API keys in .env)",
    "contract: model contract suite — run with --model <id> (tests/contract)",
]
filterwarnings = [
    "ignore:builtin type.*has no __module__:DeprecationWarning",
]
tmp_path_retention_policy = "none"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
