# Connectors — MCP servers the agent can use as tools.
# Copy to connectors.yaml (git-ignored) and restart the backend.
# Any MCP server works: https://github.com/modelcontextprotocol/servers
#
#   command/args/env   start a local server over stdio (env values expand ${VARS} from backend/.env)
#   url/headers        connect to a remote server over streamable HTTP
#   confirm            tool-name patterns that pause for your approval before running (sending, deleting…)
#   tools              optional allow-list of tool names to expose

