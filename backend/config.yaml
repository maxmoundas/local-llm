model:
  repo_id: "google/gemma-4-E4B-it"
  cache_dir: "../models"
  # 4bit recommended for 31B on 12GB VRAM (CPU offload will handle overflow)
  # options: none, 4bit, 8bit
  quantization: "4bit"
  # auto lets accelerate split across GPU + CPU RAM as needed
  device_map: "auto"
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1
  # For streaming generation
  do_sample: true

server:
  host: "0.0.0.0"
  port: 8000
  # Timeout in seconds for generation requests
  timeout: 300

logging:
  level: "INFO"
  log_dir: "logs"
  # 10MB per file
  max_bytes: 10485760
  backup_count: 5
  # Set to true to also log to console
  console: true
