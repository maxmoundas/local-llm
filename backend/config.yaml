model:
  # Built-in local model (loaded in-process onto your GPU). Off by default: when false, it is never loaded,
  # uses no GPU memory, and doesn't appear in the model menu. Set to true (or LOCAL_MODEL_ENABLED=true) to use it;
  # download the weights first with: python scripts/download_model.py
  enabled: false
  repo_id: "google/gemma-4-E4B-it"
  cache_dir: "../models"
  # 4bit: ~5 GB for Gemma 4 E4B (fits 8 GB VRAM); 8bit or none need more
  # options: none, 4bit, 8bit
  quantization: "4bit"
  # auto lets accelerate split across GPU + CPU RAM as needed
  device_map: "auto"
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.1
  # For streaming generation
  do_sample: true

server:
  # 127.0.0.1 = this machine only. To use the app from other devices, set host to "0.0.0.0" AND set
  # ACCESS_TOKEN in backend/.env (without it, only requests addressed to localhost are accepted).
  host: "127.0.0.1"
  port: 8000
  # Browser origins allowed to call the API (the Vite dev server and preview by default)
  # cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
  # Extra host names to accept without an access token (e.g. a local DNS name for this machine)
  # allowed_hosts: []
  # Timeout in seconds for generation requests
  timeout: 300

logging:
  level: "INFO"
  log_dir: "logs"
  # 10MB per file
  max_bytes: 10485760
  backup_count: 5
  # Set to true to also log to console
  console: true
